# Minimal test composition for the compose Interface: a static page served
# by busybox httpd, gated by a healthcheck.
services:
  web:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /www && echo 'orchontainer app v1' > /www/index.html && exec httpd -f -p 8080 -h /www"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
