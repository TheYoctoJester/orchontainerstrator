# llama.cpp server (b5106) serving the model from the active slot of the model
# Component. The label marks it for the llm-model Interface, which restarts
# it after a slot switch and self-tests it.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b5106
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "1024", "-t", "4"]
    volumes:
      - /apps/models/active:/models:ro
    ports:
      - "8080:8080"
    labels:
      orchontainer.llm-model-consumer: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
