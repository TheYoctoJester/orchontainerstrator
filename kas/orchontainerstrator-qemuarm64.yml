# Mender Orchestrator managing the parts of a single device
# (rootfs, docker compose app, LLM model) on qemuarm64, Yocto 6.0 "wrynose".
#
# Phase 0 build: rootfs-image Interface plus a logging "probe" Interface,
# docker + the official docker-compose Update Module installed, read-only rootfs.
#
# Run from my-qemuarm64/:
#   env -u TMPDIR kas build ../kas/orchontainerstrator-qemuarm64.yml:tyj-local.yml:tyj-debug.yml:tyj-mender.yml

header:
  version: 20

build_system: openembedded

machine: qemuarm64
distro: poky
target: orchontainerstrator-image

repos:
  orchontainerstrator:
    layers:
      meta-orchontainerstrator:

  bitbake:
    url: "https://git.openembedded.org/bitbake"
    branch: "2.18"
    layers: {}

  openembedded-core:
    url: "https://git.openembedded.org/openembedded-core"
    branch: "wrynose"
    layers:
      meta:

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    branch: "wrynose"
    layers:
      meta-poky:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: "wrynose"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    branch: "wrynose"

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: "wrynose"
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-mender:
    url: "https://github.com/mendersoftware/meta-mender"
    branch: "wrynose"
    layers:
      meta-mender-core:
      meta-mender-commercial:
      meta-mender-extended:

  meta-mender-community:
    url: "https://github.com/mendersoftware/meta-mender-community"
    branch: "wrynose"
    layers:
      meta-mender-qemu-community:

local_conf_header:
  orchontainerstrator-base: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " virtualization efi"

    INHERIT += "mender-full"
    # qemuarm64 boots via EDK2 + grub-efi (meta-mender-qemu-community README)
    EFI_PROVIDER = "grub-efi"
    MACHINE_FEATURES:append = " efi"
    MENDER_EFI_LOADER = "edk2-firmware"
    # As in meta-arm ci/edk2.yml: EDK2 instead of the machine's default u-boot
    PREFERRED_PROVIDER_virtual/bootloader = "edk2-firmware"
    EXTRA_IMAGEDEPENDS += "edk2-firmware"
    MENDER_STORAGE_DEVICE = "/dev/vda"
    MENDER_STORAGE_TOTAL_SIZE_MB = "8192"
    # scripts/run-qemu.sh has no virtio console; a getty waiting for hvc0
    # holds up multi-user.target until it times out.
    SERIAL_CONSOLES = "115200;ttyAMA0"
    # Bump for every build that gets uploaded: the server keys Artifacts by
    # name, and a rebuilt rootfs under an old name has different content.
    MENDER_ARTIFACT_NAME = "rootfs-c2"

  orchontainerstrator-partitions: |
    # Partition per class of writes; each one can fill up without starving
    # the others. Sizes are fixed for the device's lifetime, and
    # mender-growfs-data is off once extra partitions exist.
    #   /data     Mender, Orchestrator and Interface state, persisted system
    #             state; also stages non-streamed payloads (docker-compose
    #             module: images.tar.gz plus its extracted copy)
    #   /var/log  persistent journal
    #   /apps     docker and containerd data, LLM model slots
    MENDER_DATA_PART_SIZE_MB = "1024"
    MENDER_EXTRA_PARTS = "log apps"
    MENDER_EXTRA_PARTS[log] = "--fstype=ext4 --label=log"
    MENDER_EXTRA_PARTS_SIZES_MB[log] = "256"
    MENDER_EXTRA_PARTS_MOUNT_LOCATIONS[log] = "/var/log"
    MENDER_EXTRA_PARTS_FSTAB[log] = "ext4 defaults"
    MENDER_EXTRA_PARTS[apps] = "--fstype=ext4 --label=apps"
    MENDER_EXTRA_PARTS_SIZES_MB[apps] = "4096"
    MENDER_EXTRA_PARTS_MOUNT_LOCATIONS[apps] = "/apps"
    MENDER_EXTRA_PARTS_FSTAB[apps] = "ext4 defaults"

  orchontainerstrator-logs: |
    # /var/log is a real directory (mount point of the log partition)
    # instead of a symlink into the /var/volatile tmpfs.
    FILESYSTEM_PERMS_TABLES:remove = "files/fs-perms-volatile-log.txt"
    # Journal only: no busybox syslogd/klogd duplicating it into
    # /var/log/messages, no wtmp/utmp bookkeeping.
    VIRTUAL-RUNTIME_base-utils-syslog = ""
    PACKAGECONFIG:remove:pn-systemd = "utmp"

  orchontainerstrator-orchestrator: |
    LICENSE_FLAGS_ACCEPTED:append = " commercial_mender-yocto-layer-license"
    # Sets MENDER_DEVICE_TIER = "system" and installs
    # mender-orchestrator + mender-orchestrator-support
    MENDER_FEATURES_ENABLE:append = " mender-orchestrator-install"
    # Downloaded from downloads.customer.mender.io, kept out of git
    ORCHONTAINER_ORCHESTRATOR_TARBALL = "/home/tyj/builds/orchontainerstrator/downloads/mender-orchestrator-1.0.0.tar.xz"
